name: Build NikaMusic

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options: [release, debug]
        default: release
      abi:
        description: "CPU architecture"
        type: choice
        options: [arm64, universal, armeabi, x86, x86_64]
        default: arm64
  push:
    tags: ['v*']          # pushing a tag like v1.0.1 builds and publishes a GitHub Release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '["arm64","universal"]' || format('["{0}"]', github.event.inputs.abi || 'arm64')) }}
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      BUILD_TYPE: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || github.event.inputs.build_type || 'release' }}
      ABI: ${{ matrix.abi }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release builds need your signing key
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD repository secrets first. Updates only install over the old version when every release is signed with the same key."
            exit 1
          fi

      - name: Set version from the tag
        if: env.IS_RELEASE == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          grep -n "versionName\|versionCode" app/build.gradle.kts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # the platform and build-tools are downloaded by the Android Gradle plugin (the project targets API 37), like the original project's CI
          packages: "platform-tools ndk;27.0.12077973 cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Add swap (avoids out-of-memory during R8)
        run: |
          sudo fallocate -l 8G /swapfile2 || true
          sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2 || true
          free -h

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkey -v \
            -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Restore release keystore (optional for manual builds)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
            echo "Release keystore restored"
          else
            echo "No KEYSTORE_BASE64 secret: this build is signed with a throw-away debug key"
          fi

      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # logins: baked into the app at build time (see "Logins" in the README); empty is fine, the app then says the login is not set up
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          if [ -z "$STORE_PASSWORD" ]; then unset STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; fi
          A="$(echo "${ABI:0:1}" | tr a-z A-Z)${ABI:1}"
          T="$(echo "${BUILD_TYPE:0:1}" | tr a-z A-Z)${BUILD_TYPE:1}"
          chmod +x gradlew
          ./gradlew "assemble${A}Foss${T}" \
            --no-daemon --no-configuration-cache --stacktrace --console=plain \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" \
            -Dkotlin.daemon.jvm.options="-Xmx3g" \
            -Dorg.gradle.workers.max=2

      - name: Collect APK
        run: |
          mkdir -p out
          if [ "$IS_RELEASE" = "true" ]; then NAME="NikaMusic-${GITHUB_REF_NAME}-${ABI}.apk"; else NAME="NikaMusic-${ABI}-${BUILD_TYPE}.apk"; fi
          find app/build/outputs/apk -name '*.apk' -exec cp {} "out/$NAME" \;
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NikaMusic-${{ env.ABI }}
          path: out/*.apk
          if-no-files-found: error

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ env.ABI }}
          path: |
            **/build/reports/**
            **/hs_err_pid*.log
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: NikaMusic-*
          path: dist
          merge-multiple: true

      - name: Take the notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, v)) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section called '## ${GITHUB_REF_NAME}'. Add one and push the tag again."
            exit 1
          fi
          cat notes.md; ls -la dist

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: NikaMusic ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*.apk

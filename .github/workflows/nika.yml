          python3 "$RUNNER_TEMP/nika_update.py" echo "$NIKA_REPO"

      # Your changes live in this repo and are applied on top of the base app at build time:
      #   overlay/    files copied over the project (same folder layout as the project)
      #   patches/    *.patch files applied with git apply, in name order
      - name: Apply Nika customizations
        run: |
          set -e
          if [ -d nika-src/overlay ]; then cp -a nika-src/overlay/. echo/ && echo "Overlay applied"; fi
          for p in nika-src/patches/*.patch; do
            [ -f "$p" ] || continue
            [ "${{ steps.src.outputs.has }}" = "true" ] && continue   # already part of the saved source
            echo "Applying $p"
            git -C echo apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"
          done

      # Commits the complete project (with the latest branding) into this repo. The base project's own promo files
      # and CI are left out; the licence is kept. Your .github/workflows folder is never touched.
      - name: Save project into this repo
        if: ${{ inputs.save_source }}
        run: |
          set -e
          # Replace the old project files with the new ones (so removed files disappear too), keep .git and .github
          find nika-src -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar -C echo --anchored \
            --exclude='./.git' --exclude='./.github' --exclude='./.githooks' \
            --exclude='./Screenshots' --exclude='./assets' --exclude='./fastlane' \
            --exclude='./CONTRIBUTING.md' --exclude='./CODE_OF_CONDUCT.md' \
            --exclude='./SECURITY.md' --exclude='./PRIVACY_POLICY.md' --exclude='./AGENT.md' \
            --exclude='./DESIGN.md' --exclude='./SETUP.md' \
            -cf - . | tar -C nika-src -xf -
          cd nika-src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new to save"; else
            git commit -q -m "Update Nika Music project"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Android SDK/NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null

      # Fixed debug signing key so every new build installs over the previous one.
      # (Debug key only: do not use it for Play Store releases.)
      - name: Install signing key
        run: |
          mkdir -p "$HOME/.android"
          echo "" | base64 -d > "$HOME/.android/debug.keystore"

      # Gradle's download server sometimes returns 504. Retry, then try its alternate address.
      - name: Download Gradle (with retries)
        working-directory: echo
        run: |
          chmod +x gradlew
          for i in 1 2 3 4; do
            ./gradlew --version && exit 0
            echo "Attempt $i failed; waiting before retry..."; sleep $((i * 20))
          done
          echo "Switching to alternate Gradle download address"
          sed -i 's|https\\://services.gradle.org/distributions|https\\://downloads.gradle.org/distributions|' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3; do
            ./gradlew --version && exit 0
            sleep $((i * 20))
          done
          exit 1

      - name: Build APK
        working-directory: echo
        run: |
          set -o pipefail
          # Download servers (Maven/GitHub) sometimes time out with a 504. Gradle keeps what it already
          # downloaded, so simply retrying usually succeeds. Real code errors will fail every attempt.
          for i in 1 2 3 4; do
            ./gradlew assembleUniversalFossDebug --console=plain 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log" && exit 0
            echo "Build attempt $i failed; retrying in $((i * 30))s..."
            sleep $((i * 30))
          done
          exit 1

      # If the build fails, put the real error on the run's Summary page (easy to read on a phone).
      - name: Show error summary
        if: failure()
        run: |
          {
            echo "## Build error summary"
            echo '```'
            grep -n -E "^e: |What went wrong|Execution failed|> Task .* FAILED|Caused by|OutOfMemory|No space left|Could not resolve|Could not find|SDK location|NDK|error:" -A4 build.log | head -n 80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Collect APK
        run: |
          mkdir -p dist
          apk=$(find echo/app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "Found: $apk"
          cp "$apk" "dist/NikaMusic.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nika Music build ${{ github.run_number }}
          body: "${{ inputs.whats_new }}"
          files: dist/*.apk
          prerelease: false
          make_latest: true

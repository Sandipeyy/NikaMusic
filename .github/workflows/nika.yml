name: Build Nika Music

on:
  workflow_dispatch:
    inputs:
      echo_ref:
        description: "Base app commit/tag/branch to build (default = tested pin)"
        required: false
        default: "20fdf8adfc6b50ec364d5bb85535d8206d7f595f"
      save_source:
        description: "Save the project (with the latest branding) into this repo. Tick this on the first run and whenever you want updates saved."
        type: boolean
        default: false

permissions:
  contents: write 

env:
  ECHO_REPO: https://github.com/EchoMusicApp/Echo-Music.git

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Get your customizations (this repo)
        uses: actions/checkout@v4
        with:
          path: nika-src

      - name: Detect project source in this repo
        id: src
        run: |
          if [ -f nika-src/gradlew ]; then echo "has=true" >> "$GITHUB_OUTPUT"; echo "Project found in repo: building from it"
          else echo "has=false" >> "$GITHUB_OUTPUT"; echo "No project in repo yet: downloading the base app"; fi

      - name: Download base app source
        if: steps.src.outputs.has != 'true'
        run: |
          mkdir echo && cd echo
          git init -q
          git remote add origin "$ECHO_REPO"
          git fetch -q --depth 1 origin "${{ inputs.echo_ref || '20fdf8adfc6b50ec364d5bb85535d8206d7f595f' }}"
          git checkout -q FETCH_HEAD
          git log -1 --format='Building base app %h: %s'

      - name: Rebrand to Nika Music
        if: steps.src.outputs.has != 'true'
        run: |
          cat > "$RUNNER_TEMP/nika_rebrand.py" <<'PYEOF'
          #!/usr/bin/env python3
          """Rebrand Echo Music source -> Nika Music. Usage: nika_rebrand.py <echo-source-dir> [owner/repo]

          Changes only what users see (names, text, links, default accent colour; logos/icons are kept) plus the applicationId.
          Internal code (Kotlin packages, class names, resource ids, protocols) is deliberately left alone.
          """
          import glob, os, re, sys

          ROOT = sys.argv[1]
          APP_ID = "nika.music.sandip"
          BRAND_HEX = "6C4DFF"
          os.chdir(ROOT)
          RES = "app/src/main/res"
          KT = "app/src/main/kotlin/com/music/echo"

          def rd(p): return open(p, encoding="utf8").read()
          def wr(p, s): open(p, "w", encoding="utf8").write(s)
          def must_sub(path, old, new, count=1):
              s = rd(path)
              assert old in s, f"rebrand anchor missing in {path}: {old[:60]!r}"
              wr(path, s.replace(old, new, count))
  
          must_sub("app/build.gradle.kts", 'applicationId = "echo.music.iad1tya"', f'applicationId = "{APP_ID}"')
          s = rd("app/build.gradle.kts"); s = s.replace('      applicationIdSuffix = ".debug"\n', ""); wr("app/build.gradle.kts", s)
          must_sub(f"{RES}/xml/shortcuts.xml", 'android:targetPackage="echo.music.iad1tya"', f'android:targetPackage="{APP_ID}"', count=99)
          if os.path.exists("app/google-services.json"): os.remove("app/google-services.json") 
          must_sub(f"{KT}/ui/theme/Theme.kt", "val DefaultThemeColor = Color(0xFFED5564)", f"val DefaultThemeColor = Color(0xFF{BRAND_HEX})")
      
          CREDIT = re.compile(r"echodh|Agamy", re.I)
          def brand_text(t):
              if CREDIT.search(t):              
                  return "Thanks to the open-source community"
              t = re.sub(r"(?i)echo\s?music(?:app)?", "Nika Music", t)
              return re.sub(r"\bEcho\b", "Nika", t)
          node = re.compile(r">([^<>]*[Ee][Cc][Hh][Oo][^<>]*)<")
          changed_xml = []
          for f in glob.glob(f"{RES}/values*/*.xml"):
              s = rd(f); n = node.sub(lambda m: ">" + brand_text(m.group(1)) + "<", s)
              if n != s: wr(f, n); changed_xml.append(f)
          
          LIT = re.compile(r'"(?:[^"\\\n]|\\.)*"')
          def lit_fix(m):
              lit = m.group(0)
              if not re.search(r"\bEcho\b", lit) and not re.search(r"(?i)echo\s?music", lit): return lit
              if re.search(r"echo\.music|com\.music|://|/", lit): return lit     
              return brand_text(lit)
          changed_kt = []
          for f in glob.glob("app/src/**/*.kt", recursive=True):
              if "/listentogether/" in f: continue                                 
              s = rd(f); n = LIT.sub(lit_fix, s)
              if n != s: wr(f, n); changed_kt.append(f)
          must_sub(f"{KT}/ui/screens/settings/AboutScreen.kt", '"Developed by Aditya"', '"Developed by Sandip Gurung"')
          
          def skip_str(s, i):
              q = s[i]; i += 1
              while s[i] != q:
                  i += 2 if s[i] == "\\" else 1
              return i + 1
          def call_end(s, i):
              """i at start of a call/lambda. Consume balanced (...) / {...} groups incl. a trailing lambda."""
              depth = 0; seen_open = False
              while i < len(s):
                  c = s[i]
                  if c == '"': i = skip_str(s, i); continue
                  if c in "({[": depth += 1; seen_open = True
                  elif c in ")}]":
                      depth -= 1
                      if depth == 0:
                          j = i + 1
                          while s[j] in " \n\t": j += 1
                          if s[j] == "{" and s[i] == ")": i = j; continue
                          return i + 1
                  i += 1
              raise AssertionError("unbalanced block")
          def remove_block(path, anchor, start_token):
              s = rd(path); a = s.index(anchor)
              st = s.rfind(start_token, 0, a + len(start_token)); assert st != -1, anchor
              ls = s.rfind("\n", 0, st) + 1
              end = call_end(s, st)
              while end < len(s) and s[end] in " \n": end += 1
              wr(path, s[:ls] + s[end:])
          W = f"{KT}/ui/screens/WelcomeDialog.kt"; A = f"{KT}/ui/screens/settings/AboutScreen.kt"
          for t in ("Follow Developer", "Support Nika", "Community"):
              remove_block(W, f'WelcomeSectionCard(title = "{t}")', "WelcomeSectionCard(")
          remove_block(W, 'uriHandler.openUri("https://github.com/EchoMusicApp/Echo-Music")', "Button(")
          for t in ("Developer", "Support", "Community"):
              remove_block(A, f'Material3SettingsGroup(\n          title = "{t}"', "item {")
         
          must_sub(f"{KT}/echomusic/updater/echomusicupdater.kt",
                   '  withContext(Dispatchers.IO) {\n    try {\n      val url = URL("https://api.github.com/repos/EchoMusicApp/Echo-Music/releases/latest")',
                   '  withContext(Dispatchers.IO) {\n    // Nika Music has no update feed of its own yet; never offer another project\'s APK.\n    onError()\n    return@withContext\n    try {\n      val url = URL("https://api.github.com/repos/EchoMusicApp/Echo-Music/releases/latest")')
          
          SLUG = sys.argv[2] if len(sys.argv) > 2 else None
          if SLUG:
              for f in glob.glob("app/src/**/*.kt", recursive=True):
                  s = rd(f)
                  if "EchoMusicApp/Echo-Music" in s: wr(f, s.replace("EchoMusicApp/Echo-Music", SLUG))

          left = 0
          for f in glob.glob(f"{RES}/values*/*.xml"):
              left += len(re.findall(r">[^<>]*(?:\bEcho\b|(?i:echo ?music))[^<>]*<", rd(f)))
          print(f"leftover visible 'Echo' strings in resources: {left}")

          print(f"OK: {len(changed_xml)} string files, {len(changed_kt)} kotlin files")
          PYEOF
          python3 -I "$RUNNER_TEMP/nika_rebrand.py" echo "${{ github.repository }}"

      - name: Use project source from this repo
        if: steps.src.outputs.has == 'true'
        run: |
          mkdir echo
          tar -C nika-src --exclude=.git -cf - . | tar -C echo -xf -

      - name: Apply Nika branding (logo, icons, About page, README)
        run: |
          pip install --quiet pillow
          cat > "$RUNNER_TEMP/nika_update.py" <<'PYEOF2'
          #!/usr/bin/env python3
          """Nika Music branding update (safe to run more than once).
          Usage: nika_update.py <project-dir> <owner/repo>

          * Replaces the previous logo everywhere with the Nika "N" logo.
          * Keeps only the Billie Eilish and Sabrina Carpenter alternate icons and adds a Dog icon.
          * Adds Developer info to the About page (no donation links), writes README.md,
            and disables the original developer's birthday notification.
          """
          import base64, glob, io, os, re, sys
          from PIL import Image, ImageDraw

          ROOT, SLUG = sys.argv[1], sys.argv[2]
          os.chdir(ROOT)
          RES = "app/src/main/res"
          MAN = "app/src/main/AndroidManifest.xml"
          KT = "app/src/main/kotlin/com/music/echo"

          N_MASK_B64 = ""
          DOG_B64 = ""
          NMASK = Image.open(io.BytesIO(base64.b64decode(N_MASK_B64))).convert("L")
          DOG = Image.open(io.BytesIO(base64.b64decode(DOG_B64))).convert("RGB")

          def rd(p): return open(p, encoding="utf8").read()
          def wr(p, s): open(p, "w", encoding="utf8").write(s)

          # ------------------------------------------------------------------ image helpers
          WHITE, BLACK = (255, 255, 255), (0, 0, 0)

          def n_glyph(size, h_frac, color=WHITE):
              """The Nika 'N' (from the supplied logo) centred on a transparent square canvas."""
              h = max(1, round(size * h_frac)); w = max(1, round(NMASK.width * h / NMASK.height))
              if w > size: w = size; h = round(NMASK.height * w / NMASK.width)
              m = NMASK.resize((w, h), Image.LANCZOS)
              im = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              im.paste(Image.new("RGBA", (w, h), color + (255,)), ((size - w) // 2, (size - h) // 2), m)
              return im

          def tile(size, shape, h_frac=0.62):
              """Black tile (rounded square or circle) carrying the white N, supersampled for smooth edges."""
              k = 4; S = size * k
              bg = Image.new("RGBA", (S, S), (0, 0, 0, 0)); d = ImageDraw.Draw(bg)
              if shape == "round": d.ellipse([0, 0, S - 1, S - 1], fill=BLACK + (255,))
              else: d.rounded_rectangle([0, 0, S - 1, S - 1], radius=int(S * .22), fill=BLACK + (255,))
              bg.alpha_composite(n_glyph(S, h_frac))
              return bg.resize((size, size), Image.LANCZOS)

          def reflect_pad(im, pad):
              """Extend a square image by mirroring its edges (used so the dog icon fills the adaptive-icon canvas)."""
              w, h = im.size; big = Image.new("RGB", (w * 3, h * 3))
              flips = {(0, 0): Image.ROTATE_180, (1, 0): Image.FLIP_TOP_BOTTOM, (2, 0): Image.ROTATE_180,
                       (0, 1): Image.FLIP_LEFT_RIGHT, (2, 1): Image.FLIP_LEFT_RIGHT,
                       (0, 2): Image.ROTATE_180, (1, 2): Image.FLIP_TOP_BOTTOM, (2, 2): Image.ROTATE_180}
              for x in range(3):
                  for y in range(3):
                      big.paste(im if (x, y) == (1, 1) else im.transpose(flips[(x, y)]), (x * w, y * h))
              return big.crop((w - pad, h - pad, 2 * w + pad, 2 * h + pad))

          def dog_legacy(size, shape):
              k = 4; S = size * k; ph = DOG.resize((S, S), Image.LANCZOS).convert("RGBA")
              mask = Image.new("L", (S, S), 0); d = ImageDraw.Draw(mask)
              if shape == "round": d.ellipse([0, 0, S - 1, S - 1], fill=255)
              else: d.rounded_rectangle([0, 0, S - 1, S - 1], radius=int(S * .22), fill=255)
              ph.putalpha(mask); return ph.resize((size, size), Image.LANCZOS)

          def dog_foreground(size):
              """Adaptive-icon foreground: the whole photo sits inside the visible centre 2/3, mirrored scenery outside."""
              pad = DOG.width // 4
              return reflect_pad(DOG, pad).resize((size, size), Image.LANCZOS).convert("RGBA")

          def rewrite(pattern, make, required=True):
              files = [f for f in glob.glob(pattern) if f.endswith(".png")]
              assert files or not required, f"no files for {pattern}"
              for f in files: make(Image.open(f).size[0]).save(f)
              return len(files)
          
          n = 0
          for d in glob.glob(f"{RES}/mipmap-*"):
              if d.endswith(("anydpi", "anydpi-v26")): continue
              n += rewrite(f"{d}/ic_launcher.png", lambda z: tile(z, "square"), False)
              n += rewrite(f"{d}/ic_launcher_round.png", lambda z: tile(z, "round"), False)
              n += rewrite(f"{d}/ic_launcher_foreground.png", lambda z: n_glyph(z, .44), False)
              n += rewrite(f"{d}/ic_launcher_monochrome.png", lambda z: n_glyph(z, .44), False)
          assert n >= 10, "main launcher images not found"
          bgf = f"{RES}/values/ic_launcher_background.xml"
          wr(bgf, re.sub(r'(<color name="ic_launcher_background">)[^<]*(</color>)', r"\g<1>#000000\g<2>", rd(bgf)))
          for name, make in {
              "icon": lambda z: tile(z, "square", .62),                 
              "ic_launcher_nobg": lambda z: n_glyph(z, .72),            
              "echomusicnotification": lambda z: n_glyph(z, .80),      
              "ic_qs_echo_logo": lambda z: n_glyph(z, .80),            
              "ic_launcher_foreground": lambda z: n_glyph(z, .62),     
              "ic_launcher_monochrome": lambda z: n_glyph(z, .62),
          }.items():
              c = sum(rewrite(f, make, False) for f in glob.glob(f"{RES}/drawable*/{name}.png"))
              assert c >= 1 or name == "ic_launcher_monochrome", f"drawable {name} not found"
          for f in glob.glob("app/src/**/ic_launcher-playstore.png", recursive=True):
              tile(512, "square").save(f)
          for f in glob.glob(f"{RES}/drawable/echo_music_library_circle.xml"): os.remove(f)
          
          REMOVE = ("legacy_icon legacy_pixel_icon new_pixel_icon ic_launcher_static cat_icon crazy_blue_icon pookie_icon "
                    "sky_icon echo_cat_icon eko_icon ic_launcher_craft ic_launcher_sadie ic_launcher_neon_glass "
                    "ic_launcher_millie tamil_naidu_icon wierd_cat_icon").split()
          rm_re = re.compile(r"^(%s)(_round|_foreground|_monochrome|_background)?\.(png|webp|xml)$" % "|".join(REMOVE))
          removed = 0
          for f in glob.glob(f"{RES}/mipmap-*/*"):
              if rm_re.match(os.path.basename(f)): os.remove(f); removed += 1

          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for dens, z in sizes.items():
              d = f"{RES}/mipmap-{dens}"
              if not os.path.isdir(d): continue
              dog_legacy(z, "square").save(f"{d}/dog_icon.png")
              dog_legacy(z, "round").save(f"{d}/dog_icon_round.png")
              dog_foreground(round(z * 2.25)).save(f"{d}/dog_icon_foreground.png")
          os.makedirs(f"{RES}/mipmap-anydpi-v26", exist_ok=True)
          adaptive = ('<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                      '  <background android:drawable="@color/dog_icon_background"/>\n'
                      '  <foreground android:drawable="@mipmap/dog_icon_foreground"/>\n</adaptive-icon>')
          wr(f"{RES}/mipmap-anydpi-v26/dog_icon.xml", adaptive)
          wr(f"{RES}/mipmap-anydpi-v26/dog_icon_round.xml", adaptive)
          wr(f"{RES}/values/nika_colors.xml",
             '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="dog_icon_background">#000000</color>\n</resources>\n')
          
          man = rd(MAN)
          alias_re = re.compile(r"[ \t]*<activity-alias\b.*?</activity-alias>[ \t]*\n?", re.S)
          KEEP = {".MainActivityAlias", ".MainActivityBillieEilish", ".MainActivitySabrina", ".MainActivitySabrina2", ".MainActivityDog"}
          def keep_alias(m):
              return m.group(0) if re.search(r'android:name="([^"]+)"', m.group(0)).group(1) in KEEP else ""
          man = alias_re.sub(keep_alias, man)
          if ".MainActivityDog" not in man:
              billie = next(m for m in alias_re.finditer(man) if ".MainActivityBillieEilish" in m.group(0))
              dog = billie.group(0).replace("MainActivityBillieEilish", "MainActivityDog").replace("billie_eilish_icon", "dog_icon")
              man = man[:billie.end()] + "\n" + dog + man[billie.end():]
          wr(MAN, man)

          wr(f"{KT}/utils/IconUtils.kt", '''package echo.music.iad1tya.utils

          import android.content.ComponentName
          import android.content.Context
          import android.content.pm.PackageManager

          enum class AppIconType(val value: Int) {
            DEFAULT(0),
            BILLIE_EILISH(13),
            SABRINA_CARPENTER(14),
            SABRINA_CARPENTER_2(15),
            DOG(20)
          }

          object IconUtils {
            private val aliases =
              mapOf(
                AppIconType.DEFAULT to "echo.music.iad1tya.MainActivityAlias",
                AppIconType.BILLIE_EILISH to "echo.music.iad1tya.MainActivityBillieEilish",
                AppIconType.SABRINA_CARPENTER to "echo.music.iad1tya.MainActivitySabrina",
                AppIconType.SABRINA_CARPENTER_2 to "echo.music.iad1tya.MainActivitySabrina2",
                AppIconType.DOG to "echo.music.iad1tya.MainActivityDog"
              )

            fun setIcon(context: Context, iconType: AppIconType) {
              val pm = context.packageManager
              aliases.forEach { (type, className) ->
                pm.setComponentEnabledSetting(
                  ComponentName(context, className),
                  if (type == iconType) PackageManager.COMPONENT_ENABLED_STATE_ENABLED
                  else PackageManager.COMPONENT_ENABLED_STATE_DISABLED,
                  PackageManager.DONT_KILL_APP
                )
              }
            }
          }
          ''')

          scr = f"{KT}/ui/screens/settings/AppIconSettingsScreen.kt"
          s = rd(scr)
          new_list = '''val icons =
                listOf(
                  AppIconOption(AppIconType.DEFAULT, "Nika Music", "The main Nika Music icon", R.mipmap.ic_launcher),
                  AppIconOption(AppIconType.BILLIE_EILISH, "Billie Eilish", "Billie Eilish icon", R.mipmap.billie_eilish_icon),
                  AppIconOption(AppIconType.SABRINA_CARPENTER, "Sabrina Carpenter", "Sabrina Carpenter icon", R.mipmap.ic_launcher_sabrina),
                  AppIconOption(AppIconType.SABRINA_CARPENTER_2, "Sabrina Carpenter 2", "Sabrina Carpenter icon, second style", R.mipmap.ic_launcher_sabrina2),
                  AppIconOption(AppIconType.DOG, "Dog", "A calm pup enjoying the golden hour", R.mipmap.dog_icon)
                )'''
          s2, k = re.subn(r"val icons =\s*listOf\(.*?\)\.sortedBy \{ it\.title\.lowercase\(\) \}", lambda m: new_list, s, flags=re.S)
          assert k == 1 or "AppIconType.DOG" in s, "icon list not found"
          wr(scr, s2)

          # nothing may still point at a deleted icon
          dead = []
          for f in glob.glob("app/src/**/*", recursive=True):
              if not f.endswith((".kt", ".xml")): continue
              t = rd(f)
              for nm in REMOVE:
                  if re.search(r"(R\.mipmap\.|@mipmap/)%s(_round|_foreground|_monochrome|_background)?\b" % nm, t): dead.append((f, nm))
          assert not dead, f"deleted icons still referenced: {dead[:5]}"

          # ------------------------------------------------------------------ 3. About page: developer info, no donations
          ab = f"{KT}/ui/screens/settings/AboutScreen.kt"
          s = rd(ab)
          if 'title = "Developer"' not in s:
              owner = SLUG.split("/")[0]
              block = f'''      item {{
                  Material3SettingsGroup(
                    title = "Developer",
                    items =
                      listOf(
                        Material3SettingsItem(
                          icon = painterResource(R.drawable.person),
                          title = {{ Text("Sandip") }},
                          description = {{ Text("Developer of Nika Music") }},
                          onClick = {{ uriHandler.openUri("https://github.com/{owner}") }}
                        ),
                        Material3SettingsItem(
                          icon = painterResource(R.drawable.github),
                          title = {{ Text("GitHub") }},
                          description = {{ Text("{SLUG}") }},
                          onClick = {{ uriHandler.openUri("https://github.com/{SLUG}") }}
                        )
                      )
                  )
                }}

          '''
              anchor = "/* item {"
              assert anchor in s, "About anchor missing"
              s = s.replace(anchor, block + anchor, 1)
              wr(ab, s)

          # ------------------------------------------------------------------ 4. original developer's birthday notification
          ma = f"{KT}/MainActivity.kt"
          s = rd(ma)
          old = "if (today.month == java.time.Month.OCTOBER && today.dayOfMonth == 14) {"
          if old in s: wr(ma, s.replace(old, "if (false) { // disabled: belonged to the original app's developer", 1))

          # ------------------------------------------------------------------ 5. README
          wr("README.md", f'''# Nika Music

          A Material You music player for Android.

          > **Nika Music is a fork of [Echo Music](https://github.com/EchoMusicApp/Echo-Music)**, an open-source (GPL-3.0)
          > YouTube Music client. All credit for the original app goes to the Echo Music authors and contributors.

          ## What is different from Echo Music

          - New name, new logo and new package ID: `nika.music.sandip`
          - App-icon choices trimmed to the Nika icon plus Billie Eilish, Sabrina Carpenter and Dog
          - The original developer's promo, social and donation links were removed (Nika Music has none yet)
          - The About page shows this project's own developer and GitHub info

          Everything else (playback, library, synced lyrics, song recognition, downloads, widgets, Wrapped, equalizer and
          more) comes from Echo Music. See the upstream project for the full feature list and for features I haven't verified.

          ## Get the app

          Open the **Releases** page of this repository and download the file ending in `.apk` under **Assets**
          (not "Source code"). Allow installs from your browser if Android asks.

          1. Open **Actions** -> **Build Nika Music** -> **Run workflow**.
          2. When it finishes, the APK is published under **Releases**.

          On a computer: `./gradlew assembleUniversalFossDebug` (JDK 21, Android SDK + NDK 28.2.13676358).

          ## Credits and inspiration

          Echo Music (upstream project), and the open-source projects this app draws on:
          Metrolist and Vivi Music (architecture), ArchiveTune (Material You UI), Better Lyrics and SimpMusic (lyrics),
          Music Recognizer (audio recognition), BravePipe (playback and decryption handling).

          ## Licence

          GPL-3.0. See [LICENSE](LICENSE). Because this app is a derivative of GPL-3.0 software, it and any changes to it
          must stay open source under the same licence.
          ''')

          print("update OK:", n, "main images,", removed, "old icon files removed")
          PYEOF2
          python3 -I "$RUNNER_TEMP/nika_update.py" echo "${{ github.repository }}"
      
      - name: Apply Nika customizations
        run: |
          set -e
          if [ -d nika-src/overlay ]; then cp -a nika-src/overlay/. echo/ && echo "Overlay applied"; fi
          for p in nika-src/patches/*.patch; do
            [ -f "$p" ] || continue
            [ "${{ steps.src.outputs.has }}" = "true" ] && continue   # already part of the saved source
            echo "Applying $p"
            git -C echo apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"
          done

      - name: Save project into this repo
        if: ${{ inputs.save_source }}
        run: |
          set -e
          # Replace the old project files with the new ones (so removed files disappear too), keep .git and .github
          find nika-src -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar -C echo --anchored \
            --exclude='./.git' --exclude='./.github' --exclude='./.githooks' \
            --exclude='./Screenshots' --exclude='./assets' --exclude='./fastlane' \
            --exclude='./CONTRIBUTING.md' --exclude='./CODE_OF_CONDUCT.md' \
            --exclude='./SECURITY.md' --exclude='./PRIVACY_POLICY.md' --exclude='./AGENT.md' \
            --exclude='./DESIGN.md' --exclude='./SETUP.md' \
            -cf - . | tar -C nika-src -xf -
          cd nika-src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new to save"; else
            git commit -q -m "Update Nika Music project"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Android SDK/NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
      
      - name: Install signing key
        run: |
          mkdir -p "$HOME/.android"
          echo "" | base64 -d > "$HOME/.android/debug.keystore"
      
      - name: Download Gradle (with retries)
        working-directory: echo
        run: |
          chmod +x gradlew
          for i in 1 2 3 4; do
            ./gradlew --version && exit 0
            echo "Attempt $i failed; waiting before retry..."; sleep $((i * 20))
          done
          echo "Switching to alternate Gradle download address"
          sed -i 's|https\\://services.gradle.org/distributions|https\\://downloads.gradle.org/distributions|' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3; do
            ./gradlew --version && exit 0
            sleep $((i * 20))
          done
          exit 1

      - name: Build APK
        working-directory: echo
        run: |
          set -o pipefail          
          for i in 1 2 3 4; do
            ./gradlew assembleUniversalFossDebug --console=plain 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log" && exit 0
            echo "Build attempt $i failed; retrying in $((i * 30))s..."
            sleep $((i * 30))
          done
          exit 1

      - name: Show error summary
        if: failure()
        run: |
          {
            echo "## Build error summary"
            echo '```'
            grep -n -E "^e: |What went wrong|Execution failed|> Task .* FAILED|Caused by|OutOfMemory|No space left|Could not resolve|Could not find|SDK location|NDK|error:" -A4 build.log | head -n 80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Collect APK
        run: |
          mkdir -p dist
          apk=$(find echo/app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "Found: $apk"
          cp "$apk" "dist/NikaMusic-build-${{ github.run_number }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nika Music build ${{ github.run_number }}
          body: "Download the file ending in .apk under Assets below (not the 'Source code' links)."
          files: dist/*.apk
          prerelease: false
          make_latest: true

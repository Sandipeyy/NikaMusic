          # ------------------------------------------------------------------ 3h. Mochy-style profile + version cards on the Settings page
          sp_ = f"{KT}/ui/screens/settings/SettingsScreen.kt"
          s = rd(sp_)
          if "NikaProfileCards" not in s:
              needle = "    TextField(\n      value = searchQuery,"
              assert s.count(needle) == 1, "settings anchor missing"
              s = s.replace(needle, "    NikaProfileCards(navController)\n\n" + needle, 1)
              s += NIKA_PROFILE_KT
              for imp in ("androidx.compose.foundation.layout.size", "androidx.compose.foundation.background",
                          "androidx.compose.ui.draw.clip", "androidx.compose.ui.unit.sp", "androidx.compose.ui.res.painterResource",
                          "androidx.compose.runtime.Composable"):
                  if f"import {imp}\n" not in s:
                      s = s.replace("import androidx.navigation.NavController\n", f"import {imp}\nimport androidx.navigation.NavController\n", 1)
              wr(sp_, s)

          # ------------------------------------------------------------------ 3c. Discord "App Icon" -> Nika logo
          logo = Image.new("RGB", (512, 512), (14, 14, 14))
          g = n_glyph(512, 0.62)
          logo.paste(g, (0, 0), g)
          logo.save("nika_logo.png")
          LOGO_URL = f"https://raw.githubusercontent.com/{SLUG}/HEAD/nika_logo.png"
          for f in glob.glob(f"{KT}/**/*.kt", recursive=True):
              t = rd(f)
              u = t.replace("https://avatars.githubusercontent.com/u/258176326?s=200&v=4", LOGO_URL)
              u = u.replace("https://github.com/EchoMusicApp/Echo-Music", f"https://github.com/{SLUG}")
              u = u.replace('"https://echomusic.fun"', f'"https://github.com/{SLUG}/releases/latest"')
              if u != t: wr(f, u)

          # ------------------------------------------------------------------ 3d. version: fresh start
          gr = "app/build.gradle.kts"
          s = rd(gr)
          s = re.sub(r'versionCode = [^\n]+', 'versionCode = 1000 + (System.getenv("GITHUB_RUN_NUMBER")?.toIntOrNull() ?: 0)', s, count=1)
          s = re.sub(r'versionName = "[^"]*"', 'versionName = "1.0.0"', s, count=1)
          wr(gr, s)

          # ------------------------------------------------------------------ 4. original developer's birthday notification
          ma = f"{KT}/MainActivity.kt"
          s = rd(ma)
          old = "if (today.month == java.time.Month.OCTOBER && today.dayOfMonth == 14) {"
          if old in s: wr(ma, s.replace(old, "if (false) { // disabled: belonged to the original app's developer", 1))

          # ------------------------------------------------------------------ 5. README
          wr("README.md", f'''<h1 align="center">Nika Music</h1>

          <p align="center">
            <img src="nika_logo.png" width="120" alt="Nika Music logo"/>
          </p>

          <p align="center">
            A Material You music player for Android, with ad-free streaming, offline downloads and word-by-word lyrics.
          </p>

          <p align="center">
            <a href="https://github.com/{SLUG}/releases/latest"><img alt="Download" src="https://img.shields.io/badge/Download-APK-6C4DFF?style=for-the-badge&logo=android&logoColor=white"/></a>
            <img alt="License" src="https://img.shields.io/badge/License-GPL--3.0-blue?style=for-the-badge"/>
            <img alt="Android" src="https://img.shields.io/badge/Android-8.0%2B-3DDC84?style=for-the-badge&logo=android&logoColor=white"/>
          </p>

          > **Nika Music is a fork of [Echo Music](https://github.com/EchoMusicApp/Echo-Music)**, an open-source (GPL-3.0)
          > YouTube Music client. Huge thanks to the Echo Music authors and contributors, who built the app this is based on.

          ---

          ## Download

          1. Open the [**latest release**](https://github.com/{SLUG}/releases/latest).
          2. Under **Assets**, download **`NikaMusic.apk`** (not the "Source code" links).
          3. Open the file and install it. If Android asks, allow installs from your browser or file manager.

          Requires Android 8.0 (API 26) or newer. If you already have an older Nika Music build with a different signature
          or a higher version, uninstall it first.

          ## Features

          Nika Music inherits its feature set from Echo Music:

          - **Streaming and playback**: ad-free streaming, background playback, crossfade, data saver mode, audio and video switching
          - **Offline**: download songs, albums and playlists with a built-in download manager
          - **Lyrics**: synchronized lyrics with word-by-word timing, several animation styles and built-in translation
          - **Discovery**: song recognition, smart recommendations, charts, podcasts, moods and genres
